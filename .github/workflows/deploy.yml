name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

env:
  PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages with enablement token
        if: env.PAGES_TOKEN != ''
        uses: actions/configure-pages@v5
        with:
          token: ${{ env.PAGES_TOKEN }}
          enablement: true

      - name: Configure Pages
        if: env.PAGES_TOKEN == ''
        uses: actions/configure-pages@v5

      - name: Build
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ "${REPO_NAME}" = "${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            export VITEPRESS_BASE="/"
          else
            export VITEPRESS_BASE="/${REPO_NAME}/"
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
